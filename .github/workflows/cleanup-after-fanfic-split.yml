name: Cleanup after fanfic split

on:
  push:
    paths:
      - '.github/workflows/cleanup-after-fanfic-split.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GPT-Novel main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove migrated fanfic-only root content
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for entry in *; do
            case "$entry" in
              .git|.github|.codex|.editorconfig|.gitattributes|.gpt_context_handoff_deps|.codex-remote-attachments|main_novel|WEB小説話数・場面構成調査.md|ローカルAI利用価値.md|カクヨム向け現代ファンタジー設定メモ.md|冤罪で探索者ギルドを追放された異世界帰還者、田舎で拾った無口な神様少女とS級モンスター料理配信を始めたら、俺を捨てた連中が勝手に曇っていく)
                ;;
              *)
                rm -rf -- "$entry"
                ;;
            esac
          done
          rm -f .github/workflows/cleanup-after-fanfic-split.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No cleanup changes.'
            exit 0
          fi
          git commit -m 'Separate crossover fanfic from GPT-Novel main'
          git push origin main
